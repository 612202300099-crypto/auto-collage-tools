<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCollage Worker — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --card: #111214;
      --card-border: #1e2025;
      --card-hover: #1a1b1f;
      --accent: #fbbf24;
      --accent-dim: rgba(251, 191, 36, 0.15);
      --green: #22c55e;
      --green-dim: rgba(34, 197, 94, 0.15);
      --red: #ef4444;
      --red-dim: rgba(239, 68, 68, 0.15);
      --cyan: #06b6d4;
      --cyan-dim: rgba(6, 182, 212, 0.12);
      --text: #e4e4e7;
      --text-dim: #71717a;
      --text-dimmer: #3f3f46;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── HEADER ─────────────────────────────────────────── */
    .header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, #111214 0%, var(--bg) 100%);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
    }

    .brand h1 {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .brand p {
      font-size: 0.6rem;
      color: var(--text-dim);
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .status-badge {
      padding: 0.35rem 0.8rem;
      border-radius: 100px;
      font-size: 0.65rem;
      font-weight: 700;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-running { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .status-running .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-stopped { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
    .status-stopped .dot { background: var(--red); animation: none; }
    .status-scanning { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(6,182,212,0.3); }
    .status-scanning .dot { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .status-idle { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(251,191,36,0.3); }
    .status-idle .dot { background: var(--accent); }

    /* ─── LAYOUT ─────────────────────────────────────────── */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto 1fr;
      gap: 1rem;
    }

    /* ─── CARDS ──────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: #2a2b30; }

    .card-header {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.2);
    }

    .card-header span {
      font-size: 0.6rem;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
    }

    .card-body { padding: 1rem; }

    /* ─── STAT CARDS ─────────────────────────────────────── */
    .stats-row { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.2rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }

    .stat-card.processed::before { background: linear-gradient(90deg, var(--green), transparent); }
    .stat-card.errors::before { background: linear-gradient(90deg, var(--red), transparent); }
    .stat-card.skipped::before { background: linear-gradient(90deg, var(--accent), transparent); }
    .stat-card.active::before { background: linear-gradient(90deg, var(--cyan), transparent); }

    .stat-label {
      font-size: 0.6rem;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .stat-card.processed .stat-value { color: var(--green); }
    .stat-card.errors .stat-value { color: var(--red); }
    .stat-card.skipped .stat-value { color: var(--accent); }
    .stat-card.active .stat-value { color: var(--cyan); }

    /* ─── CONTROLS ───────────────────────────────────────── */
    .controls { grid-column: 1 / -1; }

    .controls .card-body {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn:hover { border-color: var(--text-dim); transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    .btn-start { background: var(--green-dim); color: var(--green); border-color: rgba(34,197,94,0.3); }
    .btn-start:hover { background: rgba(34,197,94,0.25); }
    .btn-stop { background: var(--red-dim); color: var(--red); border-color: rgba(239,68,68,0.3); }
    .btn-stop:hover { background: rgba(239,68,68,0.25); }
    .btn-scan { background: var(--cyan-dim); color: var(--cyan); border-color: rgba(6,182,212,0.3); }
    .btn-scan:hover { background: rgba(6,182,212,0.25); }

    .config-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-left: auto;
    }

    .config-group label {
      font-size: 0.6rem;
      font-family: var(--mono);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .config-input {
      width: 50px;
      padding: 0.4rem 0.5rem;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.75rem;
      text-align: center;
    }

    .config-input:focus { outline: none; border-color: var(--accent); }

    /* ─── ACTIVE JOBS ────────────────────────────────────── */
    .jobs-section { grid-column: 1 / 3; }

    .job-list {
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .job-item {
      padding: 0.8rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.3rem;
      transition: border-color 0.2s;
    }

    .job-item:hover { border-color: #2a2b30; }

    .job-resi {
      font-size: 0.75rem;
      font-weight: 700;
      font-family: var(--mono);
    }

    .job-meta {
      font-size: 0.6rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .job-status {
      font-size: 0.55rem;
      font-family: var(--mono);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      align-self: center;
    }

    .job-status.downloading { background: var(--cyan-dim); color: var(--cyan); }
    .job-status.generating { background: var(--accent-dim); color: var(--accent); }
    .job-status.uploading { background: rgba(168,85,247,0.15); color: #a855f7; }
    .job-status.validating { background: rgba(100,116,139,0.15); color: #94a3b8; }
    .job-status.done { background: var(--green-dim); color: var(--green); }
    .job-status.error { background: var(--red-dim); color: var(--red); }
    .job-status.skipped { background: rgba(251,191,36,0.1); color: #d4a017; }
    .job-status.marking { background: rgba(168,85,247,0.15); color: #a855f7; }
    .job-status.moving { background: rgba(251,146,60,0.15); color: #fb923c; }
    .job-status.queued { background: rgba(100,116,139,0.1); color: #64748b; }

    .progress-bar {
      grid-column: 1 / -1;
      height: 3px;
      background: var(--card-border);
      border-radius: 2px;
      margin-top: 0.3rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
      transition: width 0.3s;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-dimmer);
      font-size: 0.7rem;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    /* ─── LOGS ───────────────────────────────────────────── */
    .logs-section { grid-column: 3 / 4; grid-row: 3 / 5; }

    .log-list {
      max-height: 500px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 0.6rem;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
    }

    .log-entry {
      display: flex;
      gap: 0.5rem;
      padding: 0.15rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }

    .log-time { color: var(--text-dimmer); min-width: 55px; }
    .log-level { min-width: 50px; font-weight: 600; }
    .log-level.INFO { color: var(--cyan); }
    .log-level.WARN { color: var(--accent); }
    .log-level.ERROR { color: var(--red); }
    .log-level.SUCCESS { color: var(--green); }
    .log-level.DEBUG { color: var(--text-dimmer); }
    .log-msg { color: var(--text-dim); word-break: break-all; }

    /* ─── HISTORY ────────────────────────────────────────── */
    .history-section { grid-column: 1 / 3; }

    /* ─── SCROLLBAR ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ─── TIMER ──────────────────────────────────────────── */
    .next-scan {
      font-size: 0.6rem;
      font-family: var(--mono);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .next-scan .countdown {
      color: var(--accent);
      font-weight: 600;
    }

    /* ─── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        padding: 1rem;
      }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .jobs-section, .logs-section, .history-section, .controls {
        grid-column: 1 / -1;
      }
      .logs-section { grid-row: auto; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="logo">🖨️</div>
      <div class="brand">
        <h1>AutoCollage Worker</h1>
        <p>Automation Pipeline Engine</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:1rem;">
      <div class="status-badge" id="shopsBadge" style="background: rgba(168,85,247,0.15); color: #a855f7; border: 1px solid rgba(168,85,247,0.3);">
        🏪 Shops: loading...
      </div>
      <div class="next-scan" id="nextScanInfo"></div>
      <div class="status-badge" id="statusBadge">
        <div class="dot"></div>
        <span id="statusText">LOADING</span>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- STATS ROW -->
    <div class="stats-row">
      <div class="stat-card processed">
        <div class="stat-label">Processed</div>
        <div class="stat-value" id="statProcessed">0</div>
      </div>
      <div class="stat-card errors">
        <div class="stat-label">Errors</div>
        <div class="stat-value" id="statErrors">0</div>
      </div>
      <div class="stat-card skipped">
        <div class="stat-label">Skipped</div>
        <div class="stat-value" id="statSkipped">0</div>
      </div>
      <div class="stat-card active">
        <div class="stat-label">Active Jobs</div>
        <div class="stat-value" id="statActive">0</div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="card controls">
      <div class="card-header">
        <span>⚡ Worker Controls</span>
      </div>
      <div class="card-body">
        <button class="btn btn-start" id="btnStart" onclick="api('start')">▶ Start</button>
        <button class="btn btn-stop" id="btnStop" onclick="api('stop')">■ Stop</button>
        <button class="btn btn-scan" id="btnScan" onclick="api('force-scan')">⟳ Force Scan</button>
        <button class="btn" onclick="api('reset-stats')">🗑 Reset Stats</button>

        <div class="config-group" style="margin-top: 0.8rem; width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 0.4rem;">
          <div style="display: flex; gap: 0.8rem; width: 100%; align-items: center;">
            <label>Interval (min)</label>
            <input type="number" class="config-input" id="cfgInterval" min="1" max="60" value="5" onchange="updateConfig()">
            <label>Workers</label>
            <input type="number" class="config-input" id="cfgConcurrency" min="1" max="20" value="5" onchange="updateConfig()">
          </div>
          <div style="display: flex; gap: 0.8rem; width: 100%; align-items: center; margin-top: 0.5rem;">
            <label style="min-width: max-content;">Editor Text</label>
            <input type="text" class="config-input" id="cfgEditorText" placeholder="e.g. sen 3, bot session 1" style="flex: 1; text-align: left;" onchange="updateConfig()">
          </div>
          <div style="display: flex; gap: 0.8rem; width: 100%; align-items: center; margin-top: 0.5rem;">
            <label style="min-width: max-content;">Secondary Drive Link / ID</label>
            <input type="text" class="config-input" id="cfgSecondaryDrive" placeholder="Paste link or folder ID..." style="flex: 1; text-align: left;" onchange="updateConfig()">
          </div>
        </div>
      </div>
    </div>

    <!-- ACTIVE JOBS -->
    <div class="card jobs-section">
      <div class="card-header">
        <span>🔄 Active Jobs</span>
        <span id="activeCount">0 running</span>
      </div>
      <div class="card-body">
        <div class="job-list" id="activeJobsList">
          <div class="empty-state">No active jobs</div>
        </div>
      </div>
    </div>

    <!-- LOGS -->
    <div class="card logs-section">
      <div class="card-header">
        <span>📋 System Log</span>
        <span id="logCount">0 entries</span>
      </div>
      <div class="card-body">
        <div class="log-list" id="logList"></div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="card history-section">
      <div class="card-header">
        <span>📜 Recent History</span>
        <span id="historyCount">0 entries</span>
      </div>
      <div class="card-body">
        <div class="job-list" id="historyList">
          <div class="empty-state">No history yet</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ─── State Management ─────────────────────────────────────────────────
    let currentState = null;

    async function fetchState() {
      try {
        const res = await fetch('/api/state');
        currentState = await res.json();
        renderState(currentState);
      } catch (e) {
        console.error('Failed to fetch state:', e);
      }
    }

    async function fetchLogs() {
      try {
        const res = await fetch('/api/logs?limit=150');
        const logs = await res.json();
        renderLogs(logs);
      } catch (e) {
        console.error('Failed to fetch logs:', e);
      }
    }

    async function fetchConfig() {
      try {
        const res = await fetch('/api/config');
        const cfg = await res.json();
        document.getElementById('cfgInterval').value = cfg.pollIntervalMinutes;
        document.getElementById('cfgConcurrency').value = cfg.maxConcurrency;
        document.getElementById('cfgSecondaryDrive').value = cfg.secondaryDriveFolderId || '';
        document.getElementById('cfgEditorText').value = cfg.editorText || '';
        // Update shops badge
        if (cfg.shops && cfg.shops.length > 0) {
          const names = cfg.shops.map(s => s.name).join(', ');
          document.getElementById('shopsBadge').textContent = `🏪 ${cfg.shops.length} Shops: ${names}`;
        }
      } catch (e) {}
    }

    // ─── API Calls ────────────────────────────────────────────────────────
    async function api(action) {
      try {
        const res = await fetch(`/api/${action}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) alert(data.error || 'Request failed');
        fetchState();
        fetchLogs();
      } catch (e) {
        alert('Network error: ' + e.message);
      }
    }

    async function updateConfig() {
      const interval = document.getElementById('cfgInterval').value;
      const concurrency = document.getElementById('cfgConcurrency').value;
      const secondaryDrive = document.getElementById('cfgSecondaryDrive').value;
      const editorText = document.getElementById('cfgEditorText').value;
      try {
        await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pollIntervalMinutes: parseInt(interval),
            maxConcurrency: parseInt(concurrency),
            secondaryDriveFolderId: secondaryDrive,
            editorText: editorText
          }),
        });
        fetchState();
        fetchConfig();
      } catch (e) {}
    }

    // ─── Rendering ────────────────────────────────────────────────────────
    function renderState(s) {
      // Status badge
      const badge = document.getElementById('statusBadge');
      badge.className = `status-badge status-${s.status}`;
      document.getElementById('statusText').textContent = s.status.toUpperCase();

      // Stats
      document.getElementById('statProcessed').textContent = s.totalProcessed;
      document.getElementById('statErrors').textContent = s.totalErrors;
      document.getElementById('statSkipped').textContent = s.totalSkipped;
      document.getElementById('statActive').textContent = s.activeJobs.length;

      // Next scan
      const nextInfo = document.getElementById('nextScanInfo');
      if (s.nextScanAt && s.status !== 'stopped') {
        const diff = Math.max(0, Math.round((s.nextScanAt - Date.now()) / 1000));
        const min = Math.floor(diff / 60);
        const sec = diff % 60;
        nextInfo.innerHTML = `Next scan: <span class="countdown">${min}m ${sec}s</span>`;
      } else if (s.status === 'scanning') {
        nextInfo.innerHTML = '<span class="countdown">Scanning...</span>';
      } else {
        nextInfo.textContent = '';
      }

      // Buttons
      document.getElementById('btnStart').disabled = s.status !== 'stopped';
      document.getElementById('btnStop').disabled = s.status === 'stopped';
      document.getElementById('btnScan').disabled = s.status === 'stopped';

      // Active jobs
      renderJobs('activeJobsList', s.activeJobs, 'No active jobs');
      document.getElementById('activeCount').textContent = `${s.activeJobs.length} running`;

      // History
      renderJobs('historyList', s.history.slice(0, 30), 'No history yet');
      document.getElementById('historyCount').textContent = `${s.history.length} entries`;
    }

    function renderJobs(containerId, jobs, emptyMsg) {
      const container = document.getElementById(containerId);
      if (jobs.length === 0) {
        container.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
        return;
      }

      container.innerHTML = jobs.map(job => {
        const elapsed = job.completedAt
          ? ((job.completedAt - job.startedAt) / 1000).toFixed(1) + 's'
          : ((Date.now() - job.startedAt) / 1000).toFixed(0) + 's';

        return `
          <div class="job-item">
            <div>
              <div class="job-resi">${job.resi}</div>
              <div class="job-meta">${job.shopName || 'Unknown'} · ${job.variant} pcs · qty ${job.qty} · ${elapsed}</div>
              <div class="job-meta">${job.message}</div>
            </div>
            <div class="job-status ${job.status}">${job.status}</div>
            ${job.status !== 'done' && job.status !== 'error' && job.status !== 'skipped'
              ? `<div class="progress-bar"><div class="progress-fill" style="width:${job.progress}%"></div></div>`
              : ''}
          </div>
        `;
      }).join('');
    }

    function renderLogs(logs) {
      const container = document.getElementById('logList');
      document.getElementById('logCount').textContent = `${logs.length} entries`;

      container.innerHTML = logs.slice(0, 100).map(log => `
        <div class="log-entry">
          <span class="log-time">${log.timestamp}</span>
          <span class="log-level ${log.level}">${log.level}</span>
          <span class="log-msg">${escapeHtml(log.message)}</span>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ─── Polling ──────────────────────────────────────────────────────────
    fetchConfig();
    fetchState();
    fetchLogs();

    setInterval(fetchState, 2000);
    setInterval(fetchLogs, 3000);
  </script>
</body>
</html>
